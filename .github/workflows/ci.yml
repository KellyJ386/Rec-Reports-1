name: CI

on:
  pull_request:
  push:
    branches: [main, master, work]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rec_reports_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rec_reports_rls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Start server for smoke tests
        run: |
          SUPABASE_URL=https://example.invalid SUPABASE_ANON_KEY=x PORT=8000 \
            node scripts/server.mjs dist > server-smoke.log 2>&1 &
          echo $! > server-smoke.pid
      # public-config needs only SUPABASE_URL/SUPABASE_ANON_KEY to be set (any
      # value -- see src/lib/env.mjs) and never talks to Supabase itself, so
      # this loop only ever waits on process startup, not on real credentials.
      - name: Wait for smoke server to become ready
        run: |
          ready=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8000/api/v1/public-config; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Smoke server did not become ready within 30s. Server log:"
            cat server-smoke.log
            exit 1
          fi
      # SMOKE_EMAIL/SMOKE_PASSWORD are deliberately unset here: scripts/smoke.mjs
      # SKIPs the sign-in-and-beyond steps cleanly (exit 0) without real
      # credentials, so this only ever proves the deployed server answers its
      # unauthenticated health route.
      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: http://localhost:8000
        run: npm run smoke
      - name: Stop smoke test server
        if: always()
        run: |
          if [ -f server-smoke.pid ]; then
            kill "$(cat server-smoke.pid)" 2>/dev/null || true
          fi
          if [ -f server-smoke.log ]; then
            echo "---- smoke server log ----"
            cat server-smoke.log
          fi
      - run: npm run db:verify
      # db:verify:seed does two things: (1) the textual checks it always did,
      # and (2) since DATABASE_URL is set (job-level env above) and the
      # postgres:16 service is already healthy at this point, it also
      # self-bootstraps its OWN disposable scratch database (bootstrap-pre +
      # every supabase/migrations/*.sql + bootstrap-post) and actually
      # applies supabase/seed.sql (twice, to prove idempotency) against it,
      # then drops the scratch database. This is what makes a seed.sql that
      # is textually fine but violates a real trigger/constraint (e.g. a
      # write-ordering bug against a later migration's trigger) fail CI here
      # directly, instead of only surfacing downstream as a misleading
      # RLS-suite failure once db:test:rls runs against a half-seeded
      # database. It never touches the shared rec_reports_rls database the
      # steps below build up -- see scripts/verify-seed.mjs.
      - run: npm run db:verify:seed
      # The postgres:16 service above is a bare Postgres, not a Supabase
      # project, so it's missing the `authenticated` role, the `auth` schema,
      # and any applied schema. These steps recreate just enough of that
      # (scripts/ci/rls-bootstrap-*.sql) and load the real migrations/seed
      # before db:test:rls runs supabase/tests/*.sql against it. This is
      # CI-only scaffolding -- it never runs against a real Supabase project,
      # and scripts/run-rls-tests.mjs still skips cleanly for local devs
      # without a DATABASE_URL/SUPABASE_DB_URL set.
      - name: Bootstrap Supabase-style auth schema/role
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/rls-bootstrap-pre.sql
      - name: Apply migrations (supabase/migrations/*.sql, in order)
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Grant table privileges to the authenticated role
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/rls-bootstrap-post.sql
      - name: Load seed data
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      # H-2 idempotency probe: 0042_internal_helpers.sql moves five scope/
      # permission helpers into `internal`, and every one of ~200 existing
      # policies across 0002-0041 references them UNQUALIFIED inside a
      # `drop policy if exists` / `create policy` pair (the 0009+
      # convention). Before 0042's `alter database ... set search_path =
      # public, internal` fix, replaying any of those files against a
      # post-0042 database dropped the old policy (which always succeeds)
      # and then failed to recreate it (bare helper name no longer resolves
      # once the create runs in a session whose search_path never picked up
      # `internal`), silently leaving the table with that policy MISSING.
      # Re-apply three representative files here -- 0031 (training/cert
      # writes), 0038 (the RLS audit-hardening pass with the largest count
      # of touched policies), and 0040 (storage.objects itself, S-1) -- and
      # assert neither the storage.objects SELECT policy nor the named
      # training policy went missing. `alter database ... set` only affects
      # NEW sessions, so each `psql -f` below opens its own fresh
      # connection already, and the two assertions after them do too.
      - run: npm run db:test:rls
      # The H-2 replay probe below MUST stay the last DB step: re-applying an
      # older file re-creates policies a later migration superseded (e.g. 0038's
      # training_completions INSERT policy that 0039 replaced), which is fine for
      # proving replayability but would make db:test:rls fail if it ran afterwards.
      - name: Re-apply representative migrations to prove post-0042 replayability (H-2)
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0031_training_cert_writes.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0038_rls_audit_hardening.sql
          # 0038 (re-)creates "training readers can insert completions" -- an
          # ownership-free training_completions INSERT policy that
          # 0039_training_completion_ownership.sql permanently retired in
          # favor of a self-service-or-training.manage rule. Postgres ORs
          # multiple permissive policies for the same command together, so
          # replaying 0038 alone (this migration's own numbered position)
          # WITHOUT also replaying 0039 right behind it would silently
          # resurrect the exact ownership gap 0039 closed -- a real
          # regression discovered while proving this fix, not a pre-existing
          # one (see supabase/tests/training_completions.sql, which fails if
          # you skip this step). Replaying 0039 immediately after restores
          # the final, currently-intended policy set on training_completions
          # before the assertions below and before db:test:rls runs.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0039_training_completion_ownership.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0040_storage_module_reads.sql
      - name: Assert re-applied migrations did not drop RLS policies (H-2)
        run: |
          set -e
          storage_policy_count="$(psql "$DATABASE_URL" -Atc "select count(*) from pg_policies where tablename='objects' and schemaname='storage';")"
          if [ "$storage_policy_count" -lt 1 ]; then
            echo "FAIL: storage.objects has $storage_policy_count SELECT polic(ies) after replaying 0040, expected >= 1"
            exit 1
          fi
          training_policy_exists="$(psql "$DATABASE_URL" -Atc "select exists(select 1 from pg_policies where policyname='training managers can insert employee certifications');")"
          if [ "$training_policy_exists" != "t" ]; then
            echo "FAIL: \"training managers can insert employee certifications\" policy is missing after replaying 0031"
            exit 1
          fi
          stale_policy_exists="$(psql "$DATABASE_URL" -Atc "select exists(select 1 from pg_policies where policyname='training readers can insert completions');")"
          if [ "$stale_policy_exists" != "f" ]; then
            echo "FAIL: 0038's superseded \"training readers can insert completions\" policy is still present after replaying 0039 -- the ownership gap it introduced is back"
            exit 1
          fi
          echo "OK: storage.objects has $storage_policy_count SELECT polic(ies); training policy present; superseded policy absent"
